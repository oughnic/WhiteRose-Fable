# Build the ContSys Hospital, commit the build, and deploy it to GitHub Pages.
# Every push to master rebuilds the world from data/*.json (pipeline + audits)
# and publishes dist/ — a fresh model export only needs committing.
#
# The build is committed back because dist/ is an input to contsys.org: that site assembles the
# publication and the hospital into one Azure Static Web App, and the machine that assembles it
# has no Node to build this with. Without the commit, a source change here never reaches the
# published site — which is how dist/ came to be six weeks behind src/.
#
# Pages stays for now as a preview of master. It becomes redundant once the hospital is served
# from contsys.org/hospital/.
name: Deploy hospital

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build # world pipeline + audits + vite build

      # Commit the build so contsys.org can pick it up. Nothing to commit is the normal case
      # when only docs changed, so it must not fail the run. The default token deliberately does
      # not retrigger workflows, so this cannot loop.
      - name: Commit the build
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if git diff --cached --quiet; then
            echo 'dist unchanged'
          else
            git commit -m 'Rebuild dist from source'
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Pages intermittently answers "Deployment failed, try again later";
      # a second attempt has always landed it
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
